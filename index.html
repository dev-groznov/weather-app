<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Weather App</title><script defer="defer" src="./main.932d1babad075d06d800.js"></script><link href="./main.780c05cdcb2d26dabd97.css" rel="stylesheet"></head><body><header class="header"><div class="unit-toggle" id="unitToggle"><button type="button" class="unit-btn active" data-unit="uk">°C</button> <button type="button" class="unit-btn" data-unit="us">°F</button></div><form class="search-form"><input type="search" class="location-search" placeholder="Search city..."/> <button type="submit">Search</button></form></header><main class="app"><div id="loader" class="loader" hidden><div class="spinner"></div></div><section class="hero-card"><div class="hero-left"><h1 class="city" id="city">—</h1><div class="temp-block"><span class="temp" id="temp">—°</span> <span class="conditions" id="conditions">—</span></div></div><div class="hero-right"><p class="high-low" id="high-low">—</p></div></section><div class="panels"><section class="panel"><h2 class="panel-title">Weather details</h2><div class="details-grid"><div class="detail-card"><span class="detail-label">Feels like</span> <span class="detail-value" id="feelslike">—</span></div><div class="detail-card"><span class="detail-label">Wind</span> <span class="detail-value" id="wind">—</span></div><div class="detail-card"><span class="detail-label">Humidity</span> <span class="detail-value" id="humidity">—</span></div><div class="detail-card"><span class="detail-label">UV</span> <span class="detail-value" id="uvindex">—</span></div><div class="detail-card"><span class="detail-label">Visibility</span> <span class="detail-value" id="visibility">—</span></div><div class="detail-card"><span class="detail-label">Pressure</span> <span class="detail-value" id="pressure">—</span></div></div></section><section class="panel"><h2 class="panel-title">5-day weather forecast</h2><div class="forecast-list" id="forecast"></div></section></div></main></body></html>
